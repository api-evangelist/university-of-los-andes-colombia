aid: university-of-los-andes-colombia
name: University of Los Andes Colombia
x-type: university
x-category: Private Research University
description: >-
  Universidad de los Andes (Uniandes) is a private research university in Bogota, Colombia, founded
  in 1948 and ranked #179 in the QS World University Rankings 2025. Like most universities it is a
  federation of buyers rather than a producer of APIs: it publishes no developer portal, no API key
  programme, no OpenAPI of its own and no public API documentation of any kind. What it does operate,
  on its own registrable domain, is one genuinely public machine-readable surface — an OAI-PMH 2.0
  metadata harvesting endpoint for the Revistas Uniandes journal portal, which answers anonymous
  automated clients across all six protocol verbs and serves the university's own journals. Its
  second institutional repository, the DSpace 7 deployment "Seneca", sits behind a bot-detection
  challenge that returns 403 to automated clients; an undocumented host at api.uniandes.edu.co
  exists but is closed by a Cloudflare WAF on every path. Beyond that, the university's programmable
  footprint is relationships rather than engineering: a Microsoft Entra ID tenant that is its own
  SAML 2.0 and OpenID Connect identity provider, DOI registrations at both Crossref and DataCite,
  a ROR record, an OCLC CONTENTdm heritage collection and a D2L Brightspace LMS. Those are real
  institutional facts and are catalogued here as such, each carrying an x-operator that says who
  actually runs the thing — none of the vendors' contracts are attributed to Uniandes.
