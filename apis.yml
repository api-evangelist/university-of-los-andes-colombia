  - aid: university-of-los-andes-colombia:api-gateway
    name: api.uniandes.edu.co
    x-operator: institution
    description: >-
      An undocumented API host on the university's own registrable domain. It resolves through
      Cloudflare and answers HTTP 403 with the Cloudflare WAF "Attention Required!" page on every
      path attempted — /, /docs, /swagger, /openapi.json, /api-docs, /health, /v1 and
      /.well-known/openapi. The 403 is a configured block rather than an unconfigured hostname, so
      something is being served behind it, but nothing about what it serves is publicly
      discoverable. Recorded as a finding, not as a usable API: no endpoint, schema or capability is
      claimed for it because none could be observed.
    humanURL: https://api.uniandes.edu.co/
    baseURL: https://api.uniandes.edu.co
    tags: [ Gateway, Undocumented, Access Restricted ]
  - aid: university-of-los-andes-colombia:entra-identity-federation
    name: Universidad de los Andes Identity Provider (Microsoft Entra ID)
    x-operator: federation
    description: >-
      The university's own SAML 2.0 and OpenID Connect identity provider, hosted as Microsoft Entra
      ID tenant fabd047c-ff48-492a-8bbb-8f98b9fb9cca. A federation is shared by definition, but the
      IdP behind it is the institution's, and this is among the strongest institution-operated
      machine-readable surfaces the university has. Tenant ownership was verified independently of
      any name match: getuserrealm.srf for user@uniandes.edu.co returns DomainName uniandes.edu.co,
      NameSpaceType Managed and FederationBrandName "Universidad de los Andes". SAML metadata (HTTP
      200, 28KB) carries entityID https://sts.windows.net/fabd047c-ff48-492a-8bbb-8f98b9fb9cca/ with
      HTTP-Redirect and HTTP-POST SSO bindings; OIDC discovery resolves by the university's own
      domain name. Observed in production use — the Brightspace LMS redirects to this tenant's
      /saml2 endpoint. No Shibboleth IdP exists and uniandes.edu.co is not in the eduGAIN entity
      list; this tenant is the federation.
    humanURL: https://login.microsoftonline.com/uniandes.edu.co/v2.0/.well-known/openid-configuration
    baseURL: https://login.microsoftonline.com/fabd047c-ff48-492a-8bbb-8f98b9fb9cca
