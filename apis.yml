    name: Repositorio Institucional Seneca - OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH metadata harvesting interface for "Seneca", the DSpace 7 institutional repository that
      collects the university's open-access scholarly output. The host is the university's own.
      Re-probed 2026-09-01 under a browser User-Agent: the request 302s to /challenge and then
      answers HTTP 403 with a "Bot Detection" body. That is live-and-defended, not dead — a WAF is
      actively configured in front of a running DSpace. Harvesting requires coordination with the
      library. The repository's holdings are independently evidenced: 9,987 DataCite DOIs under
      prefix 10.57784 resolve to repositorio.uniandes.edu.co/entities/publication/.
