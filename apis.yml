x-coverage:
  state: gated
  reason: bot_blocked
  detail: >-
    Universidad de los Andes operates no public developer portal, no API key programme and no
    OpenAPI of its own, and this profile does not pad that absence. Real probing found one
    anonymously readable institution-operated surface — the Revistas Uniandes OAI-PMH 2.0 endpoint,
    live across all six verbs — plus a WordPress REST discovery document on the Agora news host.
    Everything else the institution runs on its own domain is closed to automated clients rather
    than absent: the DSpace 7 "Seneca" repository returns a bot-detection challenge and 403 on both
    its OAI and REST paths even under a browser User-Agent, api.uniandes.edu.co answers with a
    Cloudflare WAF block on every path tried, and the OJS REST API returns a structured 403 needing
    an editor-issued token. Coverage is therefore gated by bot mitigation on the institution's own
    infrastructure, not by the institution publishing nothing. Two further notes on the state of the
    estate at review time: the main website www.uniandes.edu.co and every path under it redirect to
    mantenimiento.uniandes.edu.co, a branded maintenance page, on three consecutive attempts — the
    Website pointer is retained because it is the canonical institutional domain serving the
    institution's own page, but the site itself was not serving content; and the news feed
    previously harvested from www.uniandes.edu.co/es/noticias is dead for the same reason, which is
    why the Blog pointer has been moved to agora.uniandes.edu.co, whose RSS feed is live. Beyond the
    institution's own hosts the footprint is relationships: an Entra ID tenant that is the
    university's own SAML/OIDC identity provider, Crossref and DataCite DOI registrations, a ROR
    record, an OCLC CONTENTdm tenancy and a D2L Brightspace tenancy. Those are recorded with
    x-operator federation, registry and tenant; none of those vendors' or registries' contracts are
    saved under this institution. No searched-and-not-found surface has been invented: DNS for
    idp/shibboleth/sso/auth/datos/datosabiertos/developer/hpc/cris/scienti under uniandes.edu.co is
    NXDOMAIN, cursos and horario return 404, adfs and exacore resolve but filter TCP 80/443 from the
    public internet, and the github.com/uniandes organization has zero public repositories.
