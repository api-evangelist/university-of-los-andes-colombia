  - aid: university-of-los-andes-colombia:patrimonio-contentdm
    name: Patrimonio Documental y Bibliografico - CONTENTdm
    x-operator: tenant
    description: >-
      The university's digital heritage and rare-materials collection, on an institution-specific
      subdomain that CNAMEs to cdm22043.contentdm.oclc.org — an OCLC CONTENTdm tenancy, site 22043.
      The tenancy is a real institutional fact and its APIs answer anonymously: /digital/api/collections
      returns 10 named collections (HTTP 200), the dmwebservices endpoint
      /digital/bl/dmwebservices/index.php?q=dmGetCollectionList/json returns the same list (HTTP 200),
      and an OAI-PMH 2.0 endpoint at /oai/oai.php reports repositoryName "Patrimonio documental y
      bibliografico - Universidad de Los Andes" with adminEmail patrimoniosisbibli@uniandes.edu.co
      (HTTP 200). The collection, the metadata and the DOIs are Uniandes'; the server and the
      contract are OCLC's, which is why the relationship is recorded and OCLC's specification is not
      saved under this institution.
    humanURL: https://patrimoniodocumental.uniandes.edu.co/
    baseURL: https://patrimoniodocumental.uniandes.edu.co/digital/api
    tags: [ Digital Collections, Cultural Heritage, CONTENTdm, OAI-PMH, Library, Tenant ]
    properties:
