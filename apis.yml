  - aid: university-of-los-andes-colombia:bloqueneon-brightspace
    name: Bloque Neon - D2L Brightspace LMS
    x-operator: tenant
    description: >-
      The university's learning management system, "Bloque Neon", on an institution-specific
      subdomain that CNAMEs to uniandes.brightspace.com — a D2L Brightspace tenancy. Unauthenticated
      requests redirect to the university's own Entra ID tenant with a SAMLRequest, which is how the
      identity federation above was discovered. Brightspace exposes the D2L Valence API, but that
      contract is D2L's product and is not saved here, and no LTI or platform-configuration document
      is publicly readable at the university's subdomain, so no LTI conformance is claimed. The
      tenancy itself is recorded because it is a real institutional surface.
    humanURL: https://bloqueneon.uniandes.edu.co/
    tags: [ Learning Management System, Brightspace, D2L, Tenant, Authenticated ]
