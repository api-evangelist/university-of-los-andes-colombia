apis:
  - aid: university-of-los-andes-colombia:revistas-oai
    name: Revistas Uniandes - OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH 2.0 metadata harvesting interface for the Revistas Uniandes scholarly journal portal —
      the only Universidad de los Andes surface found that serves an anonymous automated client real
      data. Verified live on 2026-09-01: all six verbs return HTTP 200, ListSets enumerates 100 sets
      across the portal's journals, ListRecords returns 566KB of oai_dc, and four metadata formats
      are advertised (oai_dc, marcxml, oai_marc, rfc1807). The Identify response names
      revistas.uniandes.edu.co as the repository identifier and gestionrevistas@uniandes.edu.co as
      the administrative contact. Each journal also exposes its own baseURL, e.g. /index.php/res/oai
      for Revista de Estudios Sociales. The host is the university's; the software underneath is
      Open Journal Systems 3.4.0.10 by the Public Knowledge Project, whose product specification is
      deliberately not catalogued here — OAI-PMH is an Open Archives Initiative protocol, and what
      is credited to Uniandes is the deployment, not the protocol and not the software.
    humanURL: https://revistas.uniandes.edu.co/
    baseURL: https://revistas.uniandes.edu.co/index.php/index/oai
