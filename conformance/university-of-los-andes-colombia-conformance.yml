standards:
- id: oai-pmh
  conforms: true
  operator: institution
  evidence: >-
    OAI-PMH 2.0 served live at https://revistas.uniandes.edu.co/index.php/index/oai (HTTP 200,
    text/xml). `Identify` reports protocolVersion 2.0, repositoryIdentifier
    `revistas.uniandes.edu.co`, adminEmail gestionrevistas@uniandes.edu.co, earliestDatestamp
    2021-11-12T21:25:00Z, deletedRecord `persistent`, granularity YYYY-MM-DDThh:mm:ssZ, gzip and
    deflate compression. All six verbs return 200 — ListSets enumerates 100 sets, ListRecords
    returns 566,264 bytes of oai_dc. Four metadata formats are advertised: oai_dc, marcxml,
    oai_marc, rfc1807. Per-journal baseURLs also live, e.g. /index.php/res/oai returns
    repositoryName `Revista de Estudios Sociales`. Host is under the institution's own registrable
    domain.
- id: oai-pmh
  conforms: true
  operator: tenant
  qualifier: contentdm
  evidence: >-
    A second OAI-PMH 2.0 endpoint at
    https://patrimoniodocumental.uniandes.edu.co/oai/oai.php?verb=Identify (HTTP 200) reports
    repositoryName `Patrimonio documental y bibliografico - Universidad de Los Andes`, adminEmail
    patrimoniosisbibli@uniandes.edu.co, earliestDatestamp 2022-10-07. Recorded as `tenant`, not
    `institution` — the host CNAMEs to cdm22043.contentdm.oclc.org and the software is OCLC
    CONTENTdm. The collection and the metadata are the university's; the server is OCLC's.
- id: saml
