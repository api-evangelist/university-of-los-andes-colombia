- id: datacite
  conforms: true
  operator: registry
  evidence: >-
    DataCite consortium organization `UDLAC`, displayName `Universidad de los Andes - Colombia`,
    memberType `consortium_organization` (https://api.datacite.org/providers/udlac, HTTP 200),
    operating two repository clients. `IGJZ.MNJGJS` — `Repositorios Digitales Uniandes`, domains
